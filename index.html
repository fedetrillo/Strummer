<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Strummer</title>
  <style>
    :root, [data-theme="dark"] {
      --plate: #1d1f23; --panel: #282b31; --well: #141518; --edge: #363a42;
      --text: #ecebe6; --dim: #8e939c; --silk: #b9bdc5; --wood: #3a3027; --fret: #9aa0a8;
      --acc: #4fcf86; --ok: #9be7b8; --bad: #ff8a80; --ink: #1b1d21;
      color-scheme: dark;
    }
    [data-theme="grey"] {
      --plate: #4b4f56; --panel: #585d65; --well: #41454b; --edge: #6a6f78;
      --text: #f4f3ef; --dim: #c4c7cc; --silk: #dfe1e5; --wood: #4a4038; --fret: #c9ccd1;
      --acc: #74e3a3; --ok: #b5f0cb; --bad: #ffb3a8; --ink: #1b2129;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--plate); color: var(--text); font: 13px/1.4 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-font-smoothing: antialiased; transition: background .2s; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    header { display: flex; align-items: center; padding: 10px 12px 4px; gap: 8px; }
    h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 800; }
    h1 small { font-weight: 600; color: var(--dim); font-size: 11px; margin-left: 4px; font-variant-numeric: tabular-nums; }
    .theme { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 7px; padding: 2px; }
    .theme button { width: 24px; height: 20px; border: 0; border-radius: 5px; background: none; display: grid; place-items: center; padding: 0; color: var(--dim); }
    .theme button.on { background: var(--panel); color: var(--text); }
    .theme svg { width: 12px; height: 12px; }
    select, input[type=text] { background: var(--well); border: 1px solid var(--edge); border-radius: 6px; padding: 3px 6px; font-size: 12px; }
    main { flex: 1; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--panel); border-radius: 10px; padding: 9px 10px; }
    .card h2 { margin: 0 0 7px; font-size: 11px; color: var(--dim); font-weight: 700; }
    #target b { font-size: 13px; }
    #target div { color: var(--dim); font-size: 12px; }
    #target span { color: var(--dim); font-size: 12px; margin-left: 8px; }
    .opts { display: grid; grid-template-columns: 70px 1fr; gap: 7px 8px; align-items: center; font-size: 12px; }
    .opts > label { color: var(--dim); font-size: 11.5px; }
    .seg { display: flex; flex-wrap: wrap; gap: 3px; }
    .seg button { flex: 1 0 auto; min-width: 30px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--edge); background: var(--well); color: var(--silk); font-weight: 700; font-size: 11.5px; }
    .seg button.on { background: var(--acc); border-color: var(--acc); color: var(--ink); }
    .chordrow { display: grid; grid-template-columns: 1fr 58px 70px 52px; gap: 5px; }
    #chord { font-size: 16px; font-weight: 800; padding: 3px 8px; width: 100%; }
    #chordInfo { grid-column: 1 / -1; color: var(--dim); font-size: 11.5px; min-height: 1.3em; }
    .neck { display: grid; grid-template-columns: 132px 1fr; gap: 10px; align-items: center; }
    #diagram { width: 132px; height: 150px; cursor: pointer; }
    #diagram .string { stroke: var(--fret); stroke-width: 1.2; }
    #diagram .fretline { stroke: var(--fret); stroke-width: 1; opacity: .6; }
    #diagram .nut { stroke: var(--text); stroke-width: 4; }
    #diagram .dot { fill: var(--acc); }
    #diagram .mark { fill: none; stroke: var(--silk); stroke-width: 1.5; }
    #diagram text { fill: var(--dim); font-size: 10px; font-weight: 700; }
    #diagram .hit { fill: transparent; }
    #diagram .hit:hover { fill: rgba(255,255,255,.06); }
    .shapebox { display: flex; flex-direction: column; gap: 6px; }
    .shapebox label { color: var(--dim); font-size: 11.5px; }
    .shapebox .r { display: flex; gap: 5px; }
    #shape { width: 100%; font: 700 14px ui-monospace, Menlo, monospace; letter-spacing: 1px; }
    #autoShape { border: 1px solid var(--edge); background: var(--well); border-radius: 6px; font-size: 11.5px; font-weight: 700; padding: 0 8px; }
    #notesOut { color: var(--dim); font-size: 11.5px; }
    .check { display: flex; gap: 7px; align-items: center; font-size: 12px; cursor: pointer; }
    .check input { accent-color: var(--acc); margin: 0; }
    .slider { display: grid; grid-template-columns: 1fr 48px; gap: 8px; align-items: center; }
    .slider input { width: 100%; accent-color: var(--acc); }
    .slider span { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--silk); }
    .row { display: flex; gap: 6px; margin-top: 10px; }
    .row button { flex: 1; height: 36px; border-radius: 9px; border: 1px solid var(--edge); background: var(--well); font-weight: 800; }
    .row button.main { background: var(--acc); border-color: var(--acc); color: var(--ink); flex: 2; }
    button:disabled { opacity: .4; cursor: default; }
    .hint { color: var(--dim); font-size: 11.5px; margin-top: 6px; }
    .status { text-align: center; font-size: 12px; color: var(--dim); min-height: 1.4em; }
    .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
    .keyrow { display: grid; grid-template-columns: 62px 1fr auto; gap: 5px; align-items: center; }
    #keyLuna { border: 1px solid var(--edge); background: var(--well); border-radius: 6px; font-size: 11px; font-weight: 700; padding: 3px 7px; }
    .chiphead { color: var(--dim); font-size: 11px; font-weight: 700; margin: 9px 0 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chips button { display: flex; flex-direction: column; align-items: center; min-width: 40px; padding: 3px 6px 4px; border-radius: 7px; border: 1px solid var(--edge); background: var(--well); line-height: 1.15; }
    .chips button i { font-style: normal; font-size: 9.5px; color: var(--dim); font-weight: 700; }
    .chips button b { font-size: 12.5px; }
    .chips button.hot { border-color: var(--acc); }
    .chips button.cur { background: var(--acc); border-color: var(--acc); color: var(--ink); }
    .chips button.cur i { color: var(--ink); opacity: .7; }
    span.chips { display: contents; }
    .chips.small button { opacity: .8; }
    #next button { min-width: 54px; }
    .card.tight { padding: 7px 10px; }
    .mini { display: flex; justify-content: space-between; gap: 6px; color: var(--dim); font-size: 11px; font-weight: 600; margin-bottom: 3px; }
    .mini span:last-child:not(:first-child) { color: var(--silk); font-variant-numeric: tabular-nums; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .pair select { width: 100%; }
    .block { margin-top: 8px; }
    .checks { display: flex; flex-wrap: wrap; gap: 5px 14px; margin-top: 9px; }
    .check { white-space: nowrap; }
    .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 8px; }
    .sliders input { width: 100%; accent-color: var(--acc); margin: 0; }
    .lbl { color: var(--dim); font-size: 11px; font-weight: 600; }
    .chordrow { margin-top: 8px; }
    #keyBox { margin-top: 8px; }
    .keyrow { display: grid; grid-template-columns: auto 58px 1fr auto; gap: 5px; align-items: center; }
    .chiphead { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 11px; font-weight: 600; margin: 7px 0 4px; gap: 8px; }
    .chiphead .check { font-size: 11px; color: var(--silk); }
    .chips .sep { width: 1px; align-self: stretch; background: var(--edge); margin: 0 2px; }
    .neck { margin-top: 8px; }
    #diagram { width: 100px; height: 114px; }
    .neck { grid-template-columns: 100px 1fr !important; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    #help { padding: 0; width: 28px; min-width: 28px; }
    #help b { background: none; width: auto; height: auto; font-size: 12.5px; }
  </style>
</head>
<body>
  <header>
    <h1>Strummer <small id="ver"></small></h1>
    <button id="help"></button>
    <div class="theme">
      <button data-t="dark" id="tDark"><svg viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
      <button data-t="grey" id="tGrey"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    </div>
    <select id="lang"></select>
  </header>
  <main>
    <section class="card tight"><div id="target"></div></section>

    <section class="card">
      <h2 id="chordsLabel"></h2>
      <div class="pair">
        <div><div class="mini"><span id="srcLabel"></span></div><div class="seg" id="src"></div></div>
        <div><div class="mini"><span id="instLabel"></span></div><div class="seg" id="inst"></div></div>
      </div>
      <div class="chordrow" id="chordRow">
        <input type="text" id="chord" spellcheck="false" autocomplete="off">
        <select id="root"></select>
        <select id="type"></select>
        <select id="bass"></select>
        <div id="chordInfo"></div>
      </div>
      <div id="keyBox">
        <div class="keyrow"><span class="lbl" id="keyLabel"></span><select id="key"></select><div class="seg" id="mode"></div><button id="keyLuna"></button></div>
        <div class="chiphead"><span id="inKeyLabel"></span><label class="check"><input type="checkbox" id="sev"><span id="sevLabel"></span></label></div>
        <div class="chips"><span id="diatonic" class="chips"></span><span id="borrowed" class="chips small"></span></div>
      </div>
      <div class="neck" id="guitarBox">
        <svg id="diagram" viewBox="0 0 132 150"></svg>
        <div class="shapebox">
          <div class="mini"><span id="shapeLabel"></span></div>
          <div class="r"><input type="text" id="shape" spellcheck="false" autocomplete="off"><button id="autoShape"></button></div>
          <div id="notesOut"></div>
        </div>
      </div>
      <div class="pair" id="pianoBox">
        <div><div class="mini"><span id="octLabel"></span></div><div class="seg" id="oct"></div></div>
        <label class="check" style="align-self:end;padding-bottom:4px"><input type="checkbox" id="pBass"><span id="pBassLabel"></span></label>
      </div>
      <div class="pair">
        <div id="durBox"><div class="mini"><span id="durLabel"></span></div><select id="dur"></select></div>
        <div><div class="mini"><span id="rhythmLabel"></span></div><select id="rhythm"></select></div>
      </div>
      <div class="block"><div class="mini"><span id="lenLabel"></span></div><div class="seg" id="len"></div></div>
      <div class="checks">
        <label class="check" id="advanceRow"><input type="checkbox" id="advance"><span id="advanceLabel"></span></label>
        <label class="check"><input type="checkbox" id="replace"><span id="replaceLabel"></span></label>
        <label class="check"><input type="checkbox" id="strumIns"><span id="strumInsLabel"></span></label>
      </div>
      <div class="row"><button class="main" id="insert"></button></div>
    </section>

    <section class="card">
      <h2 id="strumLabel"></h2>
      <div class="block"><div class="mini"><span id="dirLabel"></span></div><div class="seg" id="dir"></div></div>
      <div class="sliders">
        <div><div class="mini"><span id="speedLabel"></span><span id="speedVal"></span></div><input type="range" id="speed" min="0" max="60" step="1"></div>
        <div><div class="mini"><span id="accentLabel"></span><span id="accentVal"></span></div><input type="range" id="accent" min="0" max="50" step="1"></div>
        <div><div class="mini"><span id="humTLabel"></span><span id="humTVal"></span></div><input type="range" id="humT" min="0" max="20" step="1"></div>
        <div><div class="mini"><span id="humVLabel"></span><span id="humVVal"></span></div><input type="range" id="humV" min="0" max="20" step="1"></div>
      </div>
      <div class="checks"><label class="check"><input type="checkbox" id="keepEnds"><span id="keepEndsLabel"></span></label></div>
      <div class="row"><button class="main" id="apply"></button><button id="straight"></button></div>
    </section>
    <div class="status" id="status" role="status"></div>
  </main>
  <script src="vendor/luna.global.js"></script>
  <script src="tour.js"></script>
  <script src="theory.js"></script>
  <script src="main.js"></script>
</body>
</html>
